<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>柏林午餐食客</title>
<style>
  :root { --bg:#f6f4ef; --card:#fff; --ink:#222; --sub:#777; --accent:#c8102e; --line:#e4e0d8; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#1c1b19; --card:#2a2926; --ink:#eee; --sub:#9a968c; --accent:#ff5a6e; --line:#3d3b36; }
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.5 system-ui,"Noto Sans TC","Microsoft JhengHei",sans-serif; }
  main { max-width:640px; margin:0 auto; padding:0 16px 48px; }
  h1 { font-size:20px; margin:16px 0 8px; }
  h2 { font-size:17px; margin:0 0 10px; }
  nav { display:flex; gap:8px; margin:8px 0 16px; }
  nav button { flex:1; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:14px; margin-bottom:14px; }
  button { font:inherit; padding:8px 14px; border-radius:8px; border:1px solid var(--line); background:var(--card); color:var(--ink); cursor:pointer; }
  button.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
  button.on { border-color:var(--accent); color:var(--accent); font-weight:600; }
  button.link { border:0; background:none; color:var(--accent); padding:4px 6px; }
  button:disabled { opacity:.5; cursor:not-allowed; }
  input, select, textarea { font:inherit; width:100%; padding:8px 10px; border:1px solid var(--line); border-radius:8px; background:var(--bg); color:var(--ink); }
  textarea { min-height:140px; }
  main img { max-width:100%; height:auto; display:block; border-radius:8px; margin-bottom:8px; }
  label { display:block; font-size:14px; color:var(--sub); margin:10px 0 4px; }
  .row { display:flex; gap:8px; align-items:center; }
  .row > * { flex:1; }
  .item { display:flex; justify-content:space-between; align-items:center; padding:8px 0; border-bottom:1px solid var(--line); }
  .item:last-child { border-bottom:0; }
  .item small, .sub { color:var(--sub); font-size:14px; }
  .qty { display:flex; align-items:center; gap:10px; }
  .qty button { width:34px; padding:4px 0; }
  .qty b { min-width:18px; text-align:center; }
  pre { white-space:pre-wrap; background:var(--bg); border:1px solid var(--line); border-radius:8px; padding:10px; margin:8px 0; font:inherit; }
  .banner { padding:8px 12px; border-radius:8px; background:#fff3cd; color:#664d03; font-size:14px; margin-bottom:12px; }
  .tbl-wrap { overflow-x:auto; margin:8px 0; }
  .tbl { border-collapse:collapse; width:100%; font-size:14px; }
  .tbl th, .tbl td { border:1px solid var(--line); padding:4px 8px; text-align:center; white-space:nowrap; }
  .tbl td.l { text-align:left; }
  .tbl tfoot td { font-weight:600; background:var(--bg); }
  #toast { position:fixed; left:50%; bottom:24px; transform:translateX(-50%); background:#222; color:#fff; padding:10px 18px; border-radius:20px; display:none; max-width:90%; }
</style>
</head>
<body>
<main>
  <h1>🍱 柏林午餐食客</h1>
  <div id="app"></div>
</main>
<div id="toast"></div>

<script src="shops_seed.js"></script>
<script>
// 部署 Code.gs 後,把網頁應用程式網址貼在這裡。留空 = 示範模式(資料只存在這台瀏覽器)。
const API_URL = 'https://script.google.com/macros/s/AKfycbxx9HJmW6_AqSOph6jdTPLdVP0cOfOAnx1WfyOb20VJKMojsfso0D-V_FVVt8JaEVsb/exec';

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
const pad = n => String(n).padStart(2, '0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const hm = d => `${pad(d.getHours())}:${pad(d.getMinutes())}`;
const kv = {
  get(k, d = '') { try { return localStorage.getItem(k) ?? d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch {} },
};
const ss = {
  get(k) { try { return sessionStorage.getItem(k) || ''; } catch { return ''; } },
  set(k, v) { try { sessionStorage.setItem(k, v); } catch {} },
};

// ---------- API ----------
async function api(action, data = {}) {
  if (!API_URL) return local(action, data);
  const res = await fetch(API_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' }, // 避免 CORS preflight
    body: JSON.stringify({ action, pw: S.pw, ...data }),
  });
  const j = await res.json();
  if (!j.ok) throw new Error(j.error);
  return j.data;
}

// 示範模式:邏輯與 Code.gs 對應,資料存 localStorage
function local(action, r) {
  const db = JSON.parse(kv.get('bento', '{"shops":[],"depts":[],"days":{},"orders":[]}'));
  db.depts = db.depts || [];
  const save = () => kv.set('bento', JSON.stringify(db));
  const uid = () => Math.random().toString(36).slice(2, 10);
  const open = d => d && !d.closed && (!d.deadline || hm(new Date()) <= d.deadline);
  switch (action) {
    case 'checkAdmin': return true;
    case 'saveDepts': db.depts = r.depts; return save(), true;
    case 'openDays': {
      const t = ymd(new Date()), from = ymd(new Date(Date.now() - 3 * 864e5));
      return Object.values(db.days).filter(d => d.date >= from).sort((a, b) => a.date < b.date ? -1 : 1).map(d => ({
        date: d.date, shopId: d.shopId, deadline: d.deadline,
        shopName: (db.shops.find(s => s.id === d.shopId) || {}).name || '',
        open: d.date >= t && !d.closed && (d.date !== t || !d.deadline || hm(new Date()) <= d.deadline),
      }));
    }
    case 'getAll': return { shops: db.shops, depts: db.depts, day: db.days[r.date] || null, orders: db.orders.filter(o => o.date === r.date) };
    case 'addOrder': {
      const d = db.days[r.date];
      if (!open(d)) throw new Error('目前沒有開放點餐或已截止');
      const shop = db.shops.find(s => s.id === d.shopId);
      r.items.forEach(it => {
        const m = shop.menu.find(x => x.name === it.item);
        if (!m) throw new Error('菜單沒有「' + it.item + '」');
        db.orders.push({ id: uid(), date: r.date, dept: r.dept || '', name: r.name.trim(), item: m.name, price: m.price, qty: it.qty, note: r.note || '', ts: Date.now() });
      });
      return save(), true;
    }
    case 'deleteOrder': {
      const o = db.orders.find(x => x.id === r.id);
      if (o && !open(db.days[o.date])) throw new Error('已截止,無法取消,請聯絡統計人');
      db.orders = db.orders.filter(x => x.id !== r.id);
      return save(), true;
    }
    case 'saveShop': {
      const s = { ...r.shop, id: r.shop.id || uid() };
      const i = db.shops.findIndex(x => x.id === s.id);
      i >= 0 ? db.shops[i] = s : db.shops.push(s);
      return save(), true;
    }
    case 'deleteShop': db.shops = db.shops.filter(s => s.id !== r.id); return save(), true;
    case 'openDay': db.days[r.date] = { date: r.date, shopId: r.shopId, deadline: r.deadline || '', closed: false }; return save(), true;
    case 'closeDay': if (db.days[r.date]) db.days[r.date].closed = true; return save(), true;
  }
  throw new Error('未知的動作');
}

// ---------- State ----------
const TODAY = ymd(new Date());
const S = {
  tab: 'order', date: TODAY, days: [], shops: [], day: null, orders: [],
  cart: {}, name: kv.get('bento_name'), note: '', dept: kv.get('bento_dept'), depts: [],
  pw: ss.get('bento_pw'), adminOk: false, editing: null,
};
const normT = t => String(t || '').replace(/^(\d):/, '0$1:'); // "9:30" → "09:30"
const isOpen = d => !!d && !d.closed && (d.date !== TODAY || !d.deadline || hm(new Date()) <= normT(d.deadline));
const shopOf = () => S.day && S.shops.find(s => s.id === S.day.shopId);
const fmtDate = d => {
  const [y, m, dd] = d.split('-').map(Number);
  return `${m}/${dd} 週${'日一二三四五六'[new Date(y, m - 1, dd).getDay()]}`;
};
// 同事端依日期點餐:只列開放中的日期
const peopleDays = () => S.days.filter(d => d.open);
async function loadForPeople() {
  await run(async () => { S.days = await api('openDays'); });
  const list = peopleDays();
  if (!list.some(d => d.date === S.date)) S.date = list.length ? list[0].date : TODAY;
  await load();
}
function setDate(d) { S.date = d; S.cart = {}; load(); }
function dayBar() {
  const list = peopleDays();
  if (!list.length) return '';
  return `<div class="card"><label>日期</label><div style="display:flex;flex-wrap:wrap;gap:8px">` +
    list.map(d => `<button class="${d.date === S.date ? 'on' : ''}" onclick="setDate('${d.date}')">${fmtDate(d.date)} ${esc(d.shopName)}${d.open ? '' : '(已截止)'}</button>`).join('') +
    '</div></div>';
}

function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.style.display = 'block';
  clearTimeout(toast.t); toast.t = setTimeout(() => t.style.display = 'none', 2500);
}
async function run(fn) { try { await fn(); } catch (e) { toast(e.message || '發生錯誤'); } }

async function load() {
  await run(async () => {
    if (S.tab === 'admin') S.days = await api('openDays');
    const d = await api('getAll', { date: S.date });
    Object.assign(S, { shops: d.shops, depts: d.depts || [], day: d.day, orders: d.orders });
  });
  render();
}

function setTab(t) {
  S.tab = t;
  if (t === 'admin') load(); else loadForPeople();
}

// ---------- Views ----------
function render() {
  const banner = API_URL ? '' : '<div class="banner">示範模式:資料只存在這台瀏覽器。部署後端後請設定 API_URL。</div>';
  document.getElementById('app').innerHTML = banner +
    `<nav><button class="${S.tab === 'order' ? 'on' : ''}" onclick="setTab('order')">我要點餐</button>
     <button class="${S.tab === 'admin' ? 'on' : ''}" onclick="setTab('admin')">輪值人員</button></nav>` +
    ({ order: viewOrder, admin: viewAdmin }[S.tab])();
}

const imgHtml = shop => !shop ? '' : (shop.images || []).map(src =>
  `<a href="${esc(src)}" target="_blank"><img src="${esc(src)}" alt="${esc(shop.name)}菜單" loading="lazy"></a>`).join('');
function showShopImgs(id) {
  document.getElementById('d_imgs').innerHTML = imgHtml(S.shops.find(s => s.id === id));
}

function viewOrder() {
  const shop = shopOf();
  if (!shop || !peopleDays().some(d => d.date === S.date)) return '<div class="card">目前還沒開單,請等輪值人員開單。</div>';
  const open = isOpen(S.day);
  const status = open
    ? (S.day.deadline ? `截止 ${esc(S.day.deadline)}` : '點餐中')
    : '<b style="color:var(--accent)">已截止</b>';
  const menu = shop.menu.map((m, i) => `
    <div class="item"><div>${esc(m.name)} <small>$${m.price}</small></div>
    <div class="qty"><button onclick="qty(${i},-1)" ${open ? '' : 'disabled'}>−</button><b>${S.cart[i] || 0}</b>
    <button onclick="qty(${i},1)" ${open ? '' : 'disabled'}>＋</button></div></div>`).join('');
  const imgs = imgHtml(shop);
  const total = shop.menu.reduce((t, m, i) => t + (S.cart[i] || 0) * m.price, 0);
  const orders = S.orders.map(o => `
    <div class="item"><div>${esc(o.dept ? o.dept + ' ' : '')}${esc(o.name)}:${esc(o.item)} ×${o.qty}${o.note ? ` <small>(${esc(o.note)})</small>` : ''}</div>
    ${open ? `<button class="link" onclick="cancel('${o.id}')">取消</button>` : ''}</div>`).join('');
  return dayBar() + `
    <div class="card"><h2>${esc(shop.name)}</h2>
      <div class="sub">${fmtDate(S.date)} · ${status}${shop.note ? ' · ' + esc(shop.note) : ''}</div></div>
    ${imgs ? `<div class="card"><h2>菜單</h2>${imgs}<div class="sub">點圖片可放大;請在下方選擇品項</div></div>` : ''}
    <div class="card">
      <label>部門 <span style="color:var(--accent)">*必填</span></label><input id="o_dept" list="deptlist" value="${esc(S.dept)}" oninput="S.dept=this.value;kv.set('bento_dept',this.value)" placeholder="例如:RD、品保、3F">
      <datalist id="deptlist">${[...new Set(S.orders.map(o => o.dept).filter(Boolean))].map(d => `<option value="${esc(d)}">`).join('')}</datalist>
      <label>姓名 <span style="color:var(--accent)">*必填</span></label><input id="o_name" value="${esc(S.name)}" oninput="S.name=this.value" placeholder="你的名字">
      <div style="margin-top:10px">${menu}</div>
      <label>備註(選填,例如:不要辣、飯少;部門請填在上面的「部門」欄)</label><input id="o_note" value="${esc(S.note)}" oninput="S.note=this.value">
      <p><b>小計 $${total}</b></p>
      <button class="primary" style="width:100%" onclick="submitOrder()" ${open && !S.sent ? '' : 'disabled'}>${S.sent ? '✓ 已送出(要再訂請重新選品項)' : '送出訂單'}</button>
    </div>
    <div class="card"><h2>已訂(${S.orders.length} 筆)</h2>${orders || '<div class="sub">還沒有人訂</div>'}</div>
    ${S.orders.length ? viewMatrix(shop) : ''}`;
}

function viewAdmin() {
  if (!S.adminOk) {
    return `<div class="card"><label>統計人密碼</label>
      <input type="password" id="pw" value="${esc(S.pw)}" onkeydown="if(event.key==='Enter')login()">
      <p><button class="primary" onclick="login()">登入</button></p></div>`;
  }
  const shop = shopOf();
  const open = isOpen(S.day);
  const shopOpts = S.shops.map(s => `<option value="${s.id}" ${S.day && S.day.shopId === s.id ? 'selected' : ''}>${esc(s.name)}</option>`).join('');
  return `
    <div class="card"><h2>開單</h2>
      ${S.days.length ? `<label>已開單的日期(點選可查看統計/修改)</label><div style="display:flex;flex-wrap:wrap;gap:8px">` +
        [...S.days.filter(d => d.date >= TODAY), ...S.days.filter(d => d.date < TODAY)].map(d => `<button class="${d.date === S.date ? 'on' : ''}" onclick="S.date='${d.date}';load()">${fmtDate(d.date)} ${esc(d.shopName)}${d.open ? '' : '(已截止)'}</button>`).join('') + '</div>' : ''}
      <label>開新的日期(或改日期)</label><input type="date" id="d_date" value="${S.date}" onchange="S.date=this.value;load()">
      <label>店家</label><select id="d_shop" onchange="showShopImgs(this.value)">${shopOpts}</select>
      <div id="d_imgs" style="margin-top:10px">${imgHtml(S.shops.find(s => s.id === (S.day ? S.day.shopId : '')) || S.shops[0])}</div>
      <label>截止時間(選填)</label><input type="time" id="d_dl" value="${esc(S.day ? S.day.deadline : '')}">
      <div class="row" style="margin-top:12px">
        <button class="primary" onclick="openDay()" ${S.shops.length ? '' : 'disabled'}>${S.day ? '更新開單' : '開單'}</button>
        <button onclick="closeDay()" ${open ? '' : 'disabled'}>關單</button>
      </div>
      <p class="sub">${S.day ? (open ? '目前開放中' : '已關單/已截止') : '這天還沒開單'}</p>
    </div>
    ${shop ? viewSummary(shop) : ''}
    ${viewShops()}`;
}

function summaryData(orders = S.orders) {
  const byItem = {}, byPerson = {}, byDept = {};
  orders.forEach(o => {
    const dk = o.dept || '未填';
    const dd = byDept[dk] || (byDept[dk] = { qty: 0, sum: 0 });
    dd.qty += o.qty; dd.sum += o.price * o.qty;
    const b = byItem[o.item] || (byItem[o.item] = { qty: 0, price: o.price, notes: [] });
    b.qty += o.qty; if (o.note) b.notes.push(`${o.name}:${o.note}`);
    const pk = (o.dept ? o.dept + ' ' : '') + o.name;
    const p = byPerson[pk] || (byPerson[pk] = { items: [], sum: 0 });
    p.items.push(`${o.item}×${o.qty}`); p.sum += o.price * o.qty;
  });
  return { byItem, byPerson, byDept };
}

function summaryText(shop) {
  const { byItem, byDept } = summaryData();
  let count = 0, sum = 0;
  const lines = Object.entries(byItem).map(([k, v]) => {
    count += v.qty; sum += v.qty * v.price;
    return `${k} ×${v.qty} = $${v.qty * v.price}` + (v.notes.length ? `(${v.notes.join('、')})` : '');
  });
  return `【${shop.name}】${shop.phone || ''}\n${S.date} 訂購\n${lines.join('\n')}\n共 ${count} 份,合計 $${sum}`
    + '\n各部門:' + Object.entries(byDept).map(([k, v]) => `${k} ${v.qty}份`).join('、');
}

// 品項 × 部門 的統計表
function summaryMatrix(shop) {
  const dk = o => o.dept || '未填';
  const depts = [...new Set(S.orders.map(dk))].sort((a, b) => a.localeCompare(b, 'zh-Hant'));
  const order = n => { const i = shop.menu.findIndex(m => m.name === n); return i < 0 ? 999 : i; };
  const names = [...new Set(S.orders.map(o => o.item))].sort((a, b) => order(a) - order(b));
  const rows = names.map(n => {
    const os = S.orders.filter(o => o.item === n);
    const per = depts.map(d => os.filter(o => dk(o) === d).reduce((t, o) => t + o.qty, 0));
    return { name: n, price: os[0].price, per, qty: per.reduce((a, b) => a + b, 0) };
  });
  const deptSum = depts.map(d => S.orders.filter(o => dk(o) === d).reduce((t, o) => t + o.price * o.qty, 0));
  return { depts, rows, deptSum, count: rows.reduce((t, r) => t + r.qty, 0), sum: deptSum.reduce((a, b) => a + b, 0) };
}

function matrixTsv(shop) {
  const m = summaryMatrix(shop);
  return [['計數', '品項', '單價', ...m.depts].join('\t'),
    ...m.rows.map(r => [r.qty, r.name, r.price, ...r.per.map(q => q || '')].join('\t')),
    ['總數 ' + m.count, '總金額 ' + m.sum, '', ...m.deptSum].join('\t')].join('\n');
}

function viewMatrix(shop) {
  const m = summaryMatrix(shop);
  return `<div class="card"><h2>統計表(品項 × 部門)</h2><div class="tbl-wrap"><table class="tbl">
    <thead><tr><th>計數</th><th>品項</th><th>單價</th>${m.depts.map(d => `<th>${esc(d)}</th>`).join('')}</tr></thead>
    <tbody>${m.rows.map(r => `<tr><td>${r.qty}</td><td class="l">${esc(r.name)}</td><td>${r.price}</td>${r.per.map(q => `<td>${q || ''}</td>`).join('')}</tr>`).join('')}</tbody>
    <tfoot><tr><td>總數 ${m.count}</td><td class="l">總金額 $${m.sum.toLocaleString()}</td><td></td>${m.deptSum.map(s => `<td>${s}</td>`).join('')}</tr></tfoot>
    </table></div><div class="sub">最下面一列是各部門應收金額。</div>
    <button onclick="copy(matrixTsv(shopOf()))">複製表格(可貼到 Excel / Google 試算表)</button></div>`;
}

function viewSummary(shop) {
  const { byPerson } = summaryData();
  const people = Object.entries(byPerson).sort(([a], [b]) => a.localeCompare(b, 'zh-Hant')).map(([n, p]) => `${n}:${p.items.join('、')} = $${p.sum}`).join('\n');
  if (!S.orders.length) return '<div class="card"><h2>訂購彙整單</h2><div class="sub">還沒有人訂</div></div>';
  return `<div class="card"><h2>訂購彙整單(打電話用)</h2><pre id="sum">${esc(summaryText(shop))}</pre>
      <button onclick="copy(summaryText(shopOf()))">複製</button></div>
    ${viewMatrix(shop)}
    <div class="card"><h2>全部訂單(重複的可刪除)</h2>${S.orders.map(o => `
      <div class="item"><div>${esc(o.dept ? o.dept + ' ' : '')}${esc(o.name)}:${esc(o.item)} ×${o.qty}</div>
      <button class="link" onclick="if(confirm('刪除這筆?'))cancel('${o.id}')">刪除</button></div>`).join('')}</div>
    <div class="card"><h2>個人明細(收錢用)</h2><pre>${esc(people)}</pre>
      <button onclick="copy(${esc(JSON.stringify(people))})">複製</button></div>`;
}

function viewShops() {
  const list = S.shops.map(s => `
    <div class="item"><div>${esc(s.name)} <small>${esc(s.phone || '')} · ${s.menu.length} 品項</small></div>
    <div><button class="link" onclick="editShop('${s.id}')">編輯</button><button class="link" onclick="delShop('${s.id}')">刪除</button></div></div>`).join('');
  const e = S.editing;
  const form = e ? `<div class="card"><h2>${e.id ? '編輯店家' : '新增店家'}</h2>
      <label>店名</label><input id="s_name" value="${esc(e.name)}">
      <label>電話</label><input id="s_phone" value="${esc(e.phone)}">
      <label>備註(例如:要提早訂、滿額外送)</label><input id="s_note" value="${esc(e.note)}">
      <label>菜單圖片(檔名,一行一個;圖檔放在 menus 資料夾,例如 menus/abc.jpg)</label>
      <textarea id="s_imgs" style="min-height:60px">${esc((e.images || []).join('\n'))}</textarea>
      <label>菜單(一行一個,格式:品項 價格)</label>
      <textarea id="s_menu" placeholder="排骨飯 90&#10;雞腿飯 95">${esc(e.menu.map(m => m.name + ' ' + m.price).join('\n'))}</textarea>
      <div class="row" style="margin-top:12px"><button class="primary" onclick="saveShop()">儲存</button><button onclick="S.editing=null;render()">取消</button></div></div>` : '';
  return `<div class="card"><h2>店家與菜單</h2>${list || '<div class="sub">還沒有店家</div>'}
      <p><button onclick="editShop()">＋ 新增店家</button>
      ${SEED_SHOPS.some(s => !S.shops.some(x => x.name === s.name)) ? ' <button onclick="importSeed()">匯入預設店家</button>' : ''}</p></div>${form}`;
}

// ---------- Actions ----------
function qty(i, d) {
  S.sent = false;
  S.cart[i] = Math.max(0, Math.min(20, (S.cart[i] || 0) + d));
  render();
}

function submitOrder() {
  if (S.busy) return; // 連點兩次會重複送出
  const dup = S.orders.some(o => o.name === document.getElementById('o_name').value.trim() && o.dept === document.getElementById('o_dept').value.trim());
  if (dup && !confirm('你已經訂過了,確定要再加訂一份嗎?(要改的話請按「取消」該筆再重訂)')) return;
  S.busy = true;
  const btn = document.querySelector('button[onclick="submitOrder()"]');
  if (btn) { btn.disabled = true; btn.textContent = '送出中…請稍候'; }
  run(async () => {
    const val = id => (document.getElementById(id) || {}).value || '';
    S.dept = val('o_dept'); S.name = val('o_name'); S.note = val('o_note'); // 直接讀畫面上的欄位,避免狀態不同步
    const name = S.name.trim();
    if (!S.dept.trim()) { document.getElementById('o_dept').focus(); throw new Error('請在「部門」欄填寫部門(備註欄不算)'); }
    if (!name) { document.getElementById('o_name').focus(); throw new Error('請輸入姓名'); }
    const shop = shopOf();
    const items = shop.menu.map((m, i) => ({ item: m.name, qty: S.cart[i] || 0 })).filter(x => x.qty > 0);
    if (!items.length) throw new Error('請至少選一個品項');
    await api('addOrder', { date: S.date, dept: S.dept, name, items, note: S.note.trim() });
    kv.set('bento_name', name);
    S.cart = {}; S.note = '';
    toast('已送出 ✓');
    S.sent = true;
    await load();
  }).finally(() => { S.busy = false; if (btn && btn.isConnected) { btn.disabled = false; btn.textContent = '送出訂單'; } });
}

function cancel(id) {
  run(async () => { await api('deleteOrder', { id }); await load(); });
}

function login() {
  run(async () => {
    S.pw = document.getElementById('pw').value;
    await api('checkAdmin');
    ss.set('bento_pw', S.pw); S.adminOk = true;
    await load();
  });
}

function openDay() {
  run(async () => {
    await api('openDay', {
      date: document.getElementById('d_date').value,
      shopId: document.getElementById('d_shop').value,
      deadline: document.getElementById('d_dl').value,
    });
    toast('已開單'); await load();
  });
}

function closeDay() {
  run(async () => { await api('closeDay', { date: S.date }); toast('已關單'); await load(); });
}

function editShop(id) {
  S.editing = id ? JSON.parse(JSON.stringify(S.shops.find(s => s.id === id))) : { name: '', phone: '', note: '', menu: [] };
  render();
}

function parseMenu(text) {
  return text.split('\n').map(l => l.trim()).filter(Boolean).map(l => {
    const m = l.match(/^(.+?)[\s,，]+(\d+)$/);
    if (!m) throw new Error(`菜單格式錯誤:「${l}」,請用「品項 價格」`);
    return { name: m[1].trim(), price: Number(m[2]) };
  });
}

function importSeed() {
  run(async () => {
    const have = new Set(S.shops.map(s => s.name));
    const todo = SEED_SHOPS.filter(s => !have.has(s.name));
    for (let i = 0; i < todo.length; i++) {
      toast(`匯入中 ${i + 1}/${todo.length}:${todo[i].name}`);
      await api('saveShop', { shop: { ...todo[i], menu: parseMenu(todo[i].menu) } });
    }
    toast(`已匯入 ${todo.length} 家店`); await load();
  });
}

function saveShop() {
  run(async () => {
    const menu = parseMenu(document.getElementById('s_menu').value);
    if (!menu.length) throw new Error('菜單至少要有一個品項');
    await api('saveShop', { shop: {
      id: S.editing.id,
      name: document.getElementById('s_name').value.trim(),
      phone: document.getElementById('s_phone').value.trim(),
      note: document.getElementById('s_note').value.trim(),
      images: document.getElementById('s_imgs').value.split('\n').map(s => s.trim()).filter(Boolean),
      menu,
    } });
    S.editing = null; toast('已儲存'); await load();
  });
}

function delShop(id) {
  const s = S.shops.find(x => x.id === id);
  if (!confirm(`刪除「${s.name}」?`)) return;
  run(async () => { await api('deleteShop', { id }); await load(); });
}

async function copy(text) {
  try { await navigator.clipboard.writeText(text); toast('已複製'); }
  catch { toast('無法自動複製,請手動長按選取文字'); }
}

// 已輸入過密碼的話自動驗證
(async () => {
  if (S.pw || !API_URL) { try { await api('checkAdmin'); S.adminOk = true; } catch {} }
  await loadForPeople();
})();
</script>
</body>
</html>
